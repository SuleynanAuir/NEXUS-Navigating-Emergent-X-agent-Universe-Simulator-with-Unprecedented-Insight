<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS | Product Page</title>
  <meta name="description" content="NEXUS 多智能体认知推演官网：用户锚点、深度搜索、Canyon 数智孪生、多视角推演。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#070b17;
      --panel:#0f1630;
      --text:#e8edff;
      --muted:#aab5d6;
      --line:#27345f;
      --brand:#5eead4;
      --brand2:#60a5fa;
      --brand3:#a78bfa;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at -10% -20%, rgba(96,165,250,.22), transparent 60%),
        radial-gradient(1000px 700px at 110% -20%, rgba(167,139,250,.22), transparent 60%),
        var(--bg);
      line-height:1.65;
    }
    .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

    .nav{
      position:sticky;top:0;z-index:20;
      backdrop-filter: blur(10px);
      background:rgba(7,11,23,.72);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .nav-inner{
      height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;
    }
    .logo{font-weight:800;letter-spacing:.3px}
    .logo span{color:var(--brand)}
    .links{display:flex;gap:16px;flex-wrap:wrap}
    .links a{color:var(--muted);text-decoration:none;font-size:14px}
    .links a:hover{color:#fff}
    .controls{display:flex;gap:8px}
    .btn{
      border:1px solid var(--line);background:#0b1230;color:#dbe6ff;
      padding:7px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
    }
    .btn.active{border-color:var(--brand2);color:#fff}

    .hero{padding:62px 0 30px}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:24px;align-items:center}
    .hero-copy{min-width:0}
    .badge{
      display:inline-block;padding:6px 10px;border-radius:999px;
      border:1px solid rgba(94,234,212,.35);background:rgba(94,234,212,.12);
      color:var(--brand);font-size:12px;font-weight:700;
    }
    .hero-kicker{margin:14px 0 0;color:#8fdcff;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{
      margin:14px 0 12px;
      font-size:clamp(30px,5vw,58px);
      line-height:1.05;
      letter-spacing:-.02em;
    }
    .lead{max-width:920px;color:var(--muted);font-size:18px}
    .motto{
      margin:18px 0 0;padding:14px 16px;border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      display:inline-block;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }
    .motto .moon{font-size:20px;color:#e63946}
    .motto .line1{font-size:20px;color:#f77f00;font-weight:800}
    .motto .line2{font-size:20px;color:#2a9d8f;font-weight:800}
    .hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .hero-cta a{
      text-decoration:none;padding:11px 14px;border-radius:12px;font-weight:700;font-size:14px;
      border:1px solid var(--line);
    }
    .hero-cta .primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#031022;border:none}
    .hero-cta .ghost{color:#d8e3ff;background:rgba(96,165,250,.08)}
    .hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .hero-stats .pill{background:rgba(14,22,50,.88);color:#dbe6ff}
    .hero-visual{
      background:linear-gradient(180deg,rgba(96,165,250,.12),rgba(167,139,250,.08));
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;padding:16px;
      box-shadow:0 18px 50px rgba(0,0,0,.28);
    }
    .hero-visual img{width:100%;display:block;border-radius:16px;border:1px solid var(--line)}
    .visual-caption{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
    .visual-caption strong{font-size:15px}
    .visual-caption span{font-size:13px;color:var(--muted)}

    section{padding:28px 0}
    .sec-title{font-size:30px;margin:0 0 8px}
    .sec-sub{margin:0 0 16px;color:var(--muted)}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
      border:1px solid var(--line);border-radius:16px;padding:16px;
    }
    .card h3{margin:0 0 8px;font-size:16px}
    .card p{margin:0;color:var(--muted);font-size:14px}
    .card ul{margin:10px 0 0 18px;padding:0;color:var(--muted);font-size:14px}
    .card li{margin:6px 0}
    .card a{color:#91d3ff;text-decoration:none}
    .card a:hover{text-decoration:underline}
    .card .eyebrow{display:inline-block;margin-bottom:10px;padding:4px 8px;border-radius:999px;background:rgba(94,234,212,.1);border:1px solid rgba(94,234,212,.25);color:#91fff0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .card-spotlight{padding:18px;min-height:100%}
    .card-spotlight h3{font-size:18px;line-height:1.35}
    .card-spotlight p{margin-top:6px}
    .card-spotlight .quote{margin-top:10px;padding:10px 12px;border-left:3px solid var(--brand2);background:rgba(96,165,250,.08);border-radius:12px;color:#dce8ff;font-size:13px}
    .spotlight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .spotlight-grid .wide{grid-column:span 2}

    .arch-img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}

    .steps{display:grid;gap:10px}
    .step{
      border-left:3px solid var(--brand3);
      background:rgba(167,139,250,.12);
      border-radius:10px;padding:10px 12px;font-size:15px;
    }

    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .shot{
      position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
      background:#0b1228;
      transition:transform .35s ease, box-shadow .35s ease;
    }
    .shot:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.28)}
    .shot img{width:100%;height:200px;object-fit:cover;display:block}
    .shot .meta{padding:10px 11px;background:#0d1530}
    .shot .meta b{font-size:14px}
    .shot .meta p{font-size:12px;color:var(--muted);margin:4px 0 0}

    .metrics{display:flex;gap:10px;flex-wrap:wrap}
    .pill{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#0d1634;color:var(--muted);font-size:13px}

    .reveal{opacity:0;transform:translateY(18px);transition:all .75s cubic-bezier(.2,.65,.2,1)}
    .reveal.on{opacity:1;transform:translateY(0)}

    .lightbox{
      position:fixed;inset:0;display:none;place-items:center;z-index:30;
      background:rgba(0,0,0,.75);padding:20px;
    }
    .lightbox.on{display:grid}
    .lightbox img{max-width:min(1100px,95vw);max-height:86vh;border-radius:12px;border:1px solid #3b4f86}
    .lightbox button{position:absolute;top:14px;right:18px}

    footer{padding:34px 0 40px;color:var(--muted);font-size:13px}

    @media (max-width:780px){
      .links{display:none}
      .hero{padding-top:40px}
      .hero-grid{grid-template-columns:1fr}
      .shot img{height:180px}
      .spotlight-grid .wide{grid-column:span 1}
    }
  </style>
</head>

    function setLang(lang){
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        el.textContent = i18n[lang][key] || '';
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el=>{
        const key = el.getAttribute('data-i18n-html');
        el.innerHTML = i18n[lang][key] || '';
      });
      document.getElementById('langZh').classList.toggle('active', lang==='zh');
      document.getElementById('langEn').classList.toggle('active', lang==='en');
      localStorage.setItem('nexus_lang', lang);
    }

    document.getElementById('langZh').addEventListener('click', ()=>setLang('zh'));
    document.getElementById('langEn').addEventListener('click', ()=>setLang('en'));

    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add('on');
          observer.unobserve(entry.target);
        }
      });
    },{threshold:.12});
    document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    document.querySelectorAll('.shot img').forEach(img=>{
      img.addEventListener('click', ()=>{
        lightboxImg.src = img.src;
        lightbox.classList.add('on');
      });
    });
    function closeLightbox(){ lightbox.classList.remove('on'); }
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });

    setLang(localStorage.getItem('nexus_lang') || 'zh');
  </script>
