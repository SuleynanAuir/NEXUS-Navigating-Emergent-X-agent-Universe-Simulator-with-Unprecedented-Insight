<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS·推演即洞察</title>
  <meta name="description" content="NEXUS 多智能体认知推演：告别模板化分析，用注意力锚点 + 深度搜索 + 数智孪生，在真实信息流中推演未来策略。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ----- 设计令牌 & 现代化重置 ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f7fd;
      --bg-soft: #ffffff;
      --surface: #ffffffcc;
      --surface-solid: #ffffff;
      --text-primary: #0b1b33;
      --text-secondary: #2e405b;
      --text-tertiary: #5d6f88;
      --brand-primary: #0f6f6b;
      --brand-primary-light: #d0f0ee;
      --brand-accent: #2b59ff;
      --brand-accent-soft: #e5ecfe;
      --brand-purple: #7b42f0;
      --border-light: #e0e7f0;
      --border-focus: #b5c8ff;
      --shadow-sm: 0 4px 12px rgba(0, 20, 40, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 10px 28px -8px rgba(0, 35, 60, 0.12), 0 4px 12px rgba(0, 0, 0, 0.02);
      --shadow-lg: 0 24px 48px -16px rgba(15, 111, 107, 0.25);
      --glass-bg: rgba(255, 255, 255, 0.75);
      --grid-color: rgba(43, 89, 255, 0.03);
      --gradient-hero: radial-gradient(100% 50% at 0% 30%, rgba(43, 89, 255, 0.08) 0%, transparent 80%),
                       radial-gradient(80% 60% at 100% 20%, rgba(123, 66, 240, 0.06) 0%, transparent 80%),
                       var(--bg);
      --gradient-card: linear-gradient(145deg, #ffffff 0%, #fafdff 100%);
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--gradient-hero);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
    }

    /* 微网格背景 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 1px 1px, var(--grid-color) 1.2px, transparent 0);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: -1;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* ----- 导航栏 (更精致) ----- */
    .nav {
      position: sticky;
      top: 18px;
      z-index: 50;
      margin-top: 18px;
      border-radius: 60px;
      backdrop-filter: blur(16px) saturate(180%);
      background: var(--glass-bg);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: var(--shadow-sm);
      width: fit-content;
      max-width: 90%;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 10px;
    }

    .nav-inner {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: nowrap;
    }

    .logo {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #0b1b33, #1d3a5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 0 8px;
    }
    .logo span {
      background: linear-gradient(145deg, var(--brand-primary), var(--brand-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .links {
      display: flex;
      gap: 6px;
    }
    .links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 560;
      padding: 8px 14px;
      border-radius: 40px;
      transition: all 0.2s ease;
      background: transparent;
    }
    .links a:hover {
      background: rgba(43, 89, 255, 0.06);
      color: var(--brand-accent);
    }

    .controls {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    .btn {
      border: 1px solid var(--border-light);
      background: rgba(255,255,255,0.5);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 32px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(2px);
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }
    .btn.active {
      border-color: var(--brand-accent);
      color: var(--brand-accent);
      background: white;
      box-shadow: 0 2px 8px rgba(43,89,255,0.15);
    }
    .btn:hover {
      background: white;
      border-color: var(--border-focus);
    }

    /* ----- 通用标题/卡片样式 ----- */
    section {
      padding: 44px 0 32px;
    }

    .sec-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(165deg, #0b1b33, #1a3857);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .sec-sub {
      font-size: 1.2rem;
      color: var(--text-tertiary);
      max-width: 720px;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .card {
      background: var(--gradient-card);
      border: 1px solid #ffffff;
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(2px);
      transition: all 0.3s cubic-bezier(0.2,0,0,1);
      height: 100%;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-focus);
    }

    .card h3 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .card p, .card li {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 40px;
      background: var(--brand-primary-light);
      color: var(--brand-primary);
      border: 1px solid rgba(15,111,107,0.2);
      margin-bottom: 16px;
    }

    /* hero 区域 */
    .hero {
      padding-top: 40px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.95fr;
      gap: 40px;
      align-items: center;
    }
    .hero-kicker {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--brand-accent);
      margin: 10px 0 8px;
    }
    h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(148deg, #0b1b33 20%, #1f4172 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 10px 0 20px;
    }
    .lead {
      font-size: 1.2rem;
      color: var(--text-secondary);
      max-width: 600px;
    }
    .motto {
      margin: 24px 0 16px;
      padding: 18px 24px;
      border-radius: 40px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(43,89,255,0.2);
      box-shadow: 0 8px 22px -12px var(--brand-primary);
      width: fit-content;
      font-size: 1.3rem;
      line-height: 1.4;
    }
    .hero-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 24px 0 16px;
    }
    .pill {
      padding: 8px 18px;
      border-radius: 60px;
      background: white;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: var(--shadow-sm);
    }
    .hero-cta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .hero-cta a {
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 48px;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .hero-cta .primary {
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
      color: white;
      box-shadow: 0 12px 28px -12px var(--brand-primary);
      border: none;
    }
    .hero-cta .primary:hover {
      transform: scale(1.02);
      box-shadow: 0 18px 32px -10px var(--brand-accent);
    }
    .hero-cta .ghost {
      background: white;
      color: var(--brand-accent);
      border: 1px solid var(--border-focus);
    }
    .hero-cta .ghost:hover {
      background: var(--brand-accent-soft);
    }

    .hero-visual {
      background: rgba(255,255,255,0.4);
      border-radius: 36px;
      padding: 14px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: var(--shadow-lg);
    }
    .hero-visual img {
      border-radius: 24px;
      width: 100%;
      display: block;
      border: 1px solid white;
    }
    .visual-caption {
      display: flex;
      justify-content: space-between;
      padding: 12px 10px 4px;
      color: var(--text-tertiary);
      font-size: 0.85rem;
    }

    /* spotlight 区域 (宽卡片) */
    .spotlight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .wide {
      grid-column: span 2;
    }
    @media (max-width: 900px) {
      .wide { grid-column: span 1; }
    }

    .card-spotlight .quote {
      margin: 16px 0 10px;
      padding: 16px 18px;
      background: var(--brand-accent-soft);
      border-left: 4px solid var(--brand-accent);
      border-radius: 20px;
      font-style: italic;
      color: #0b2b4f;
    }

    /* 架构图 */
    .arch-img {
      border-radius: 28px;
      border: 1px solid white;
      box-shadow: var(--shadow-md);
      width: 100%;
    }

    /* 步骤条 */
    .steps {
      display: grid;
      gap: 12px;
    }
    .step {
      border-left: 4px solid var(--brand-purple);
      background: rgba(123, 66, 240, 0.04);
      border-radius: 0 24px 24px 0;
      padding: 18px 24px;
      font-weight: 500;
      color: var(--text-primary);
      backdrop-filter: blur(2px);
    }

    /* 画廊 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .shot {
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.6);
      background: white;
      transition: all 0.3s ease;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .shot:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: var(--shadow-lg);
    }
    .shot img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid var(--border-light);
    }
    .meta {
      padding: 16px;
      background: white;
    }

    /* metrics 标签组 */
    .metrics {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .metrics .pill {
      background: white;
      font-size: 1rem;
      padding: 12px 24px;
    }

    /* 页脚 */
    footer {
      padding: 40px 0;
      color: var(--text-tertiary);
      font-size: 0.9rem;
      border-top: 1px solid var(--border-light);
      margin-top: 24px;
    }

    /* 揭示动画 */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: all 0.9s cubic-bezier(0.18, 0.96, 0.3, 1);
    }
    .reveal.on {
      opacity: 1;
      transform: translateY(0);
    }

    /* lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 100;
      background: rgba(10, 20, 40, 0.8);
      backdrop-filter: blur(12px);
      padding: 32px;
    }
    .lightbox.on { display: grid; }
    .lightbox img {
      max-width: min(1200px, 90vw);
      max-height: 85vh;
      border-radius: 28px;
      border: 2px solid white;
      box-shadow: var(--shadow-lg);
    }
    .lightbox .btn {
      position: absolute;
      top: 28px;
      right: 32px;
      background: white;
      border: none;
      font-size: 1rem;
      padding: 12px 24px;
    }

    /* 移动端优化 */
    @media (max-width: 780px) {
      .nav { top: 8px; margin-top: 8px; }
      .links { display: none; }
      .hero-grid { grid-template-columns: 1fr; }
      h1 { font-size: 2.8rem; }
      .sec-title { font-size: 2.4rem; }
    }
  </style>
</head>

      // 语言切换函数
      function setLang(lang){
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (i18n[lang][key]) el.textContent = i18n[lang][key];
        });
        document.querySelectorAll('[data-i18n-html]').forEach(el => {
          const key = el.getAttribute('data-i18n-html');
          if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
        });
        document.getElementById('langZh').classList.toggle('active', lang==='zh');
        document.getElementById('langEn').classList.toggle('active', lang==='en');
        localStorage.setItem('nexus_lang', lang);
      }

      document.getElementById('langZh').addEventListener('click', ()=>setLang('zh'));
      document.getElementById('langEn').addEventListener('click', ()=>setLang('en'));

      // 滚动揭示动画
      const observer = new IntersectionObserver((entries)=>{
        entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('on'); observer.unobserve(e.target); } });
      }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

      // 灯箱
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      document.querySelectorAll('.shot img').forEach(img => {
        img.addEventListener('click', () => {
          lightboxImg.src = img.src;
          lightbox.classList.add('on');
        });
      });
      function closeLightbox(){ lightbox.classList.remove('on'); }
      document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });

      // 初始语言
      const saved = localStorage.getItem('nexus_lang') || 'zh';
      setLang(saved);
    })();
