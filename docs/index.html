<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS | Product Page</title>
  <meta name="description" content="NEXUS 多智能体认知推演官网：用户锚点、深度搜索、Canyon 数智孪生、多视角推演。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#070b17;
      --panel:#0f1630;
      --text:#e8edff;
      --muted:#aab5d6;
      --line:#27345f;
      --brand:#5eead4;
      --brand2:#60a5fa;
      --brand3:#a78bfa;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at -10% -20%, rgba(96,165,250,.22), transparent 60%),
        radial-gradient(1000px 700px at 110% -20%, rgba(167,139,250,.22), transparent 60%),
        var(--bg);
      line-height:1.65;
    }
    .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

    .nav{
      position:sticky;top:0;z-index:20;
      backdrop-filter: blur(10px);
      background:rgba(7,11,23,.72);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .nav-inner{
      height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;
    }
    .logo{font-weight:800;letter-spacing:.3px}
    .logo span{color:var(--brand)}
    .links{display:flex;gap:16px;flex-wrap:wrap}
    .links a{color:var(--muted);text-decoration:none;font-size:14px}
    .links a:hover{color:#fff}
    .controls{display:flex;gap:8px}
    .btn{
      border:1px solid var(--line);background:#0b1230;color:#dbe6ff;
      padding:7px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
    }
    .btn.active{border-color:var(--brand2);color:#fff}

    .hero{padding:62px 0 24px}
    .badge{
      display:inline-block;padding:6px 10px;border-radius:999px;
      border:1px solid rgba(94,234,212,.35);background:rgba(94,234,212,.12);
      color:var(--brand);font-size:12px;font-weight:700;
    }
    h1{
      margin:14px 0 12px;
      font-size:clamp(30px,5vw,58px);
      line-height:1.05;
      letter-spacing:-.02em;
    }
    .lead{max-width:920px;color:var(--muted);font-size:18px}
    .hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .hero-cta a{
      text-decoration:none;padding:11px 14px;border-radius:12px;font-weight:700;font-size:14px;
      border:1px solid var(--line);
    }
    .hero-cta .primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#031022;border:none}
    .hero-cta .ghost{color:#d8e3ff;background:rgba(96,165,250,.08)}

    section{padding:28px 0}
    .sec-title{font-size:30px;margin:0 0 8px}
    .sec-sub{margin:0 0 16px;color:var(--muted)}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
      border:1px solid var(--line);border-radius:16px;padding:16px;
    }
    .card h3{margin:0 0 8px;font-size:16px}
    .card p{margin:0;color:var(--muted);font-size:14px}

    .arch-img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}

    .steps{display:grid;gap:10px}
    .step{
      border-left:3px solid var(--brand3);
      background:rgba(167,139,250,.12);
      border-radius:10px;padding:10px 12px;font-size:15px;
    }

    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .shot{
      position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
      background:#0b1228;
      transition:transform .35s ease, box-shadow .35s ease;
    }
    .shot:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.28)}
    .shot img{width:100%;height:200px;object-fit:cover;display:block}
    .shot .meta{padding:10px 11px;background:#0d1530}
    .shot .meta b{font-size:14px}
    .shot .meta p{font-size:12px;color:var(--muted);margin:4px 0 0}

    .metrics{display:flex;gap:10px;flex-wrap:wrap}
    .pill{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#0d1634;color:var(--muted);font-size:13px}

    .reveal{opacity:0;transform:translateY(18px);transition:all .75s cubic-bezier(.2,.65,.2,1)}
    .reveal.on{opacity:1;transform:translateY(0)}

    .lightbox{
      position:fixed;inset:0;display:none;place-items:center;z-index:30;
      background:rgba(0,0,0,.75);padding:20px;
    }
    .lightbox.on{display:grid}
    .lightbox img{max-width:min(1100px,95vw);max-height:86vh;border-radius:12px;border:1px solid #3b4f86}
    .lightbox button{position:absolute;top:14px;right:18px}

    footer{padding:34px 0 40px;color:var(--muted);font-size:13px}

    @media (max-width:780px){
      .links{display:none}
      .hero{padding-top:40px}
      .shot img{height:180px}
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <div class="logo">NEXUS <span>Product</span></div>
      <div class="links">
        <a href="#value" data-i18n="navValue"></a>
        <a href="#architecture" data-i18n="navArch"></a>
        <a href="#workflow" data-i18n="navFlow"></a>
        <a href="#gallery" data-i18n="navGallery"></a>
        <a href="#metrics" data-i18n="navMetrics"></a>
      </div>
      <div class="controls">
        <button class="btn active" id="langZh">中文</button>
        <button class="btn" id="langEn">EN</button>
      </div>
    </div>
  </nav>

  <header class="hero wrap reveal">
    <span class="badge" data-i18n="badge"></span>
    <h1 data-i18n="heroTitle"></h1>
    <p class="lead" data-i18n="heroLead"></p>
    <div class="hero-cta">
      <a class="primary" href="https://github.com/SuleynanAuir/NEXUS-Navigating-Emergent-X-agent-Universe-Simulator-with-Unprecedented-Insight" target="_blank" rel="noopener" data-i18n="ctaRepo"></a>
      <a class="ghost" href="https://github.com/SuleynanAuir/NEXUS-Navigating-Emergent-X-agent-Universe-Simulator-with-Unprecedented-Insight/blob/main/README.md" target="_blank" rel="noopener" data-i18n="ctaReadme"></a>
    </div>
  </header>

  <main class="wrap">
    <section id="value" class="reveal">
      <h2 class="sec-title" data-i18n="valueTitle"></h2>
      <p class="sec-sub" data-i18n="valueSub"></p>
      <div class="grid">
        <article class="card">
          <h3 data-i18n="f1Title"></h3>
          <p data-i18n="f1Desc"></p>
        </article>
        <article class="card">
          <h3 data-i18n="f2Title"></h3>
          <p data-i18n="f2Desc"></p>
        </article>
        <article class="card">
          <h3 data-i18n="f3Title"></h3>
          <p data-i18n="f3Desc"></p>
        </article>
        <article class="card">
          <h3 data-i18n="f4Title"></h3>
          <p data-i18n="f4Desc"></p>
        </article>
      </div>
    </section>

    <section id="architecture" class="reveal">
      <h2 class="sec-title" data-i18n="archTitle"></h2>
      <p class="sec-sub" data-i18n="archSub"></p>
      <img class="arch-img" src="https://raw.githubusercontent.com/SuleynanAuir/NEXUS-Navigating-Emergent-X-agent-Universe-Simulator-with-Unprecedented-Insight/main/assets/mermaid.png" alt="NEXUS Architecture" loading="lazy" />
    </section>

    <section id="workflow" class="reveal">
      <h2 class="sec-title" data-i18n="flowTitle"></h2>
      <div class="steps">
        <div class="step" data-i18n="s1"></div>
        <div class="step" data-i18n="s2"></div>
        <div class="step" data-i18n="s3"></div>
        <div class="step" data-i18n="s4"></div>
        <div class="step" data-i18n="s5"></div>
      </div>
    </section>

    <section id="gallery" class="reveal">
      <h2 class="sec-title" data-i18n="galleryTitle"></h2>
      <p class="sec-sub" data-i18n="gallerySub"></p>
      <div class="gallery">
        <article class="shot">
          <img src="https://raw.githubusercontent.com/SuleynanAuir/NEXUS-Navigating-Emergent-X-agent-Universe-Simulator-with-Unprecedented-Insight/main/assets/1_search/search_page.png" alt="Search Page" loading="lazy" />
          <div class="meta"><b data-i18n="g1Title"></b><p data-i18n="g1Desc"></p></div>
        </article>
        <article class="shot">
          <img src="https://raw.githubusercontent.com/SuleynanAuir/NEXUS-Navigating-Emergent-X-agent-Universe-Simulator-with-Unprecedented-Insight/main/assets/1_search/generate_report_result.png" alt="Report" loading="lazy" />
          <div class="meta"><b data-i18n="g2Title"></b><p data-i18n="g2Desc"></p></div>
        </article>
        <article class="shot">
          <img src="https://raw.githubusercontent.com/SuleynanAuir/NEXUS-Navigating-Emergent-X-agent-Universe-Simulator-with-Unprecedented-Insight/main/assets/2_canyon/step3/overview.png" alt="Canyon Overview" loading="lazy" />
          <div class="meta"><b data-i18n="g3Title"></b><p data-i18n="g3Desc"></p></div>
        </article>
        <article class="shot">
          <img src="https://raw.githubusercontent.com/SuleynanAuir/NEXUS-Navigating-Emergent-X-agent-Universe-Simulator-with-Unprecedented-Insight/main/assets/2_canyon/step4/report/report_graphrag.png" alt="GraphRAG Report" loading="lazy" />
          <div class="meta"><b data-i18n="g4Title"></b><p data-i18n="g4Desc"></p></div>
        </article>
      </div>
    </section>

    <section id="metrics" class="reveal">
      <h2 class="sec-title" data-i18n="mTitle"></h2>
      <div class="metrics">
        <span class="pill" data-i18n="m1"></span>
        <span class="pill" data-i18n="m2"></span>
        <span class="pill" data-i18n="m3"></span>
      </div>
    </section>

    <footer class="reveal">
      <span data-i18n="foot"></span>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="btn" id="lightboxClose">Close</button>
    <img id="lightboxImg" alt="Preview" />
  </div>

  <script>
    const i18n = {
      zh: {
        navValue:"产品价值", navArch:"系统架构", navFlow:"工作流", navGallery:"截图画廊", navMetrics:"性能指标",
        badge:"NEXUS Product Page",
        heroTitle:"更像产品官网的一页式 NEXUS 展示",
        heroLead:"NEXUS 聚焦用户真实关注点，通过 Attention Anchors、深度搜索、GraphRAG 和 Canyon 数智孪生世界，完成从现实信息流到未来情境推演的端到端闭环。",
        ctaRepo:"查看 GitHub 仓库", ctaReadme:"阅读完整 README",
        valueTitle:"核心能力", valueSub:"不做模板答案，做可推演的个性化决策洞察。",
        f1Title:"🎯 用户独享 Cognitive Map", f1Desc:"将用户锚点注入建模链路，输出与你任务目标强相关的分析路径。",
        f2Title:"🔍 高保真深度搜索", f2Desc:"Pressure-Driven + Iterative Reflection + Uncertainty-aware，减少冲突与幻觉。",
        f3Title:"🌍 Canyon 数智孪生", f3Desc:"在多角色交互环境中模拟事件演化，逼近真实世界传播逻辑。",
        f4Title:"🧠 多视角推演", f4Desc:"覆盖政策、企业、公众、专家四类主体，形成可对照策略空间。",
        archTitle:"系统架构总览", archSub:"对应 README 的核心架构图。",
        flowTitle:"五步工作流",
        s1:"Step 1：领域适配微调与先验注入，构建任务相关知识底座。",
        s2:"Step 2：客制化深度搜索，优先保证相关性、时效性与证据质量。",
        s3:"Step 3：用户注意力驱动理解，采集高亮/标注并结构化。",
        s4:"Step 4：Canyon 仿真推演，多 Agent 动态互动与环境反馈。",
        s5:"Step 5：报告生成与访谈交互，输出可追问、可解释的洞察。",
        galleryTitle:"模块截图画廊", gallerySub:"点击任意截图可放大预览。",
        g1Title:"搜索与检索配置", g1Desc:"深度搜索入口与策略控制。",
        g2Title:"结构化报告输出", g2Desc:"多 Agent 结果整合与摘要。",
        g3Title:"Canyon 仿真总览", g3Desc:"虚拟环境中的动态推演过程。",
        g4Title:"最终分析报告", g4Desc:"可用于决策支持与复盘。",
        mTitle:"性能与效率（项目口径）",
        m1:"成本下降约 40%~60%",
        m2:"总时长压缩至约 1/3",
        m3:"支持 LLM_BOOST 并行加速配置",
        foot:"Built with README narrative · NEXUS © 2026"
      },
      en: {
        navValue:"Value", navArch:"Architecture", navFlow:"Workflow", navGallery:"Gallery", navMetrics:"Metrics",
        badge:"NEXUS Product Page",
        heroTitle:"A Product-Like One-Page NEXUS Website",
        heroLead:"NEXUS anchors to real user intent via Attention Anchors, Deep Search, GraphRAG, and the Canyon digital cognitive twin, forming an end-to-end loop from real-world streams to future scenario simulation.",
        ctaRepo:"Open GitHub Repo", ctaReadme:"Read Full README",
        valueTitle:"Core Capabilities", valueSub:"From generic answers to simulation-ready, personalized decision insight.",
        f1Title:"🎯 User-Exclusive Cognitive Map", f1Desc:"Inject user anchors into modeling pipelines for highly task-aligned analysis paths.",
        f2Title:"🔍 High-Fidelity Deep Search", f2Desc:"Pressure-Driven + Iterative Reflection + Uncertainty-aware to reduce conflicts and hallucinations.",
        f3Title:"🌍 Canyon Digital Twin", f3Desc:"Simulates event evolution in multi-role interactions, closer to real-world dynamics.",
        f4Title:"🧠 Multi-View Reasoning", f4Desc:"Covers policy, enterprise, public, and experts for comparative strategy space.",
        archTitle:"Architecture Overview", archSub:"The key architecture map adapted from README.",
        flowTitle:"Five-Step Workflow",
        s1:"Step 1: Domain-adaptive tuning and prior injection for a task-specific knowledge base.",
        s2:"Step 2: Customized deep search with relevance, recency, and evidence quality first.",
        s3:"Step 3: User-attention-driven understanding from highlights/annotations.",
        s4:"Step 4: Canyon simulation with multi-agent interaction and environment feedback.",
        s5:"Step 5: Report generation and interview interaction for explainable insights.",
        galleryTitle:"Module Screenshot Gallery", gallerySub:"Click any screenshot to preview in full size.",
        g1Title:"Search & Retrieval Setup", g1Desc:"Entry and strategy controls for deep search.",
        g2Title:"Structured Report Output", g2Desc:"Consolidated summaries from multi-agent collaboration.",
        g3Title:"Canyon Simulation Overview", g3Desc:"Dynamic reasoning process in the virtual world.",
        g4Title:"Final Analytical Report", g4Desc:"Ready for decision support and post-analysis.",
        mTitle:"Efficiency & Throughput (Project-level)",
        m1:"Estimated 40%~60% cost reduction",
        m2:"Total runtime reduced to around one-third",
        m3:"Supports parallel acceleration via LLM_BOOST config",
        foot:"Built with README narrative · NEXUS © 2026"
      }
    };

    function setLang(lang){
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        el.textContent = i18n[lang][key] || '';
      });
      document.getElementById('langZh').classList.toggle('active', lang==='zh');
      document.getElementById('langEn').classList.toggle('active', lang==='en');
      localStorage.setItem('nexus_lang', lang);
    }

    document.getElementById('langZh').addEventListener('click', ()=>setLang('zh'));
    document.getElementById('langEn').addEventListener('click', ()=>setLang('en'));

    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add('on');
          observer.unobserve(entry.target);
        }
      });
    },{threshold:.12});
    document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    document.querySelectorAll('.shot img').forEach(img=>{
      img.addEventListener('click', ()=>{
        lightboxImg.src = img.src;
        lightbox.classList.add('on');
      });
    });
    function closeLightbox(){ lightbox.classList.remove('on'); }
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });

    setLang(localStorage.getItem('nexus_lang') || 'zh');
  </script>
</body>
</html>
